<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ma. Luisa Victoria S. Sanchez — Portfolio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Georgia', 'Times New Roman', serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1e293b 0%, #334155 50%, #1e293b 100%);
      background-size: 200% 200%;
      animation: bgShift 18s ease infinite;
      color: #f1f5f9;
      padding: 60px 30px;
      position: relative;
      overflow-x: hidden;
    }

    @keyframes bgShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: rgba(56, 189, 248, 0.5);
      border-radius: 50%;
      animation: float 15s infinite;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(100vh) scale(0);
        opacity: 0;
      }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% {
        transform: translateY(-100vh) scale(1);
        opacity: 0;
      }
    }

    .grid-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(56, 189, 248, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.02) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    .main-container {
      max-width: 550px;
      margin: 0 auto;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .profile-img {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #38bdf8;
      box-shadow: 
        0 0 0 4px rgba(56, 189, 248, 0.15),
        0 10px 30px rgba(0, 0, 0, 0.3);
      margin-bottom: 30px;
      opacity: 0;
      transform: translateY(20px) scale(0.9);
      animation: profileAppear 1.2s forwards ease-out;
      transition: all 0.5s ease;
    }

    .profile-img:hover {
      transform: translateY(-5px) scale(1.05);
      box-shadow: 
        0 15px 40px rgba(56, 189, 248, 0.2),
        0 0 30px rgba(56, 189, 248, 0.15);
    }

    @keyframes profileAppear {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .name {
      font-size: 2.2rem;
      color: #f8fafc;
      margin-bottom: 10px;
      letter-spacing: 1px;
      opacity: 0;
      transform: translateY(15px);
      animation: fadeUp 1s forwards ease-out;
      animation-delay: 0.4s;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .title {
      font-size: 1rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 40px;
      opacity: 0;
      animation: fadeIn 1s forwards ease-out;
      animation-delay: 0.7s;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .typewriter-container {
      min-height: 70px;
      margin-bottom: 45px;
      opacity: 0;
      animation: fadeIn 1s forwards ease-out;
      animation-delay: 1.0s;
    }

    #typewriter-text {
      font-size: 1.1rem;
      color: #cbd5e1;
      font-style: italic;
      border-right: 2px solid #38bdf8;
      padding-right: 5px;
      animation: blink 0.8s infinite;
      line-height: 1.6;
    }

    @keyframes blink {
      0%, 100% { border-color: #38bdf8; }
      50% { border-color: transparent; }
    }

    .nav-buttons {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 20px;
    }

    .nav-btn {
      padding: 15px 30px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 1.05rem;
      letter-spacing: 1px;
      transition: all 0.4s ease;
      opacity: 0;
      transform: translateY(15px);
      animation: btnAppear 0.7s forwards ease-out;
      position: relative;
      overflow: hidden;
    }

    .nav-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      transition: left 0.6s ease;
    }

    .nav-btn:hover::before {
      left: 100%;
    }

    .nav-btn:nth-child(1) {
      background: linear-gradient(135deg, #38bdf8, #2563eb);
      color: white;
      border: none;
      animation-delay: 1.4s;
    }

    .nav-btn:nth-child(2) {
      background: transparent;
      color: #94a3b8;
      border: 2px solid rgba(56, 189, 248, 0.3);
      animation-delay: 1.7s;
    }

    .nav-btn:nth-child(3) {
      background: transparent;
      color: #94a3b8;
      border: 2px solid rgba(56, 189, 248, 0.3);
      animation-delay: 2.0s;
    }

    @keyframes btnAppear {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .nav-btn:nth-child(1):hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(56, 189, 248, 0.3);
    }

    .nav-btn:nth-child(2):hover,
    .nav-btn:nth-child(3):hover {
      border-color: #38bdf8;
      color: #e2e8f0;
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(56, 189, 248, 0.1);
    }

    .footer-note {
      margin-top: 50px;
      font-size: 0.9rem;
      color: #475569;
      opacity: 0;
      animation: fadeIn 1s forwards ease-out;
      animation-delay: 2.6s;
    }

    .footer-note span {
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>
  <div class="grid-overlay"></div>

  <div class="main-container">
    <!-- ⚠️ CHANGE THIS TO YOUR ACTUAL PHOTO FILENAME! -->
    <img src="your-photo.jpg" alt="Ma. Luisa Victoria S. Sanchez" class="profile-img" />
    
    <h1 class="name">Ma. Luisa Victoria S. Sanchez</h1>
    <p class="title">Aspiring IT Professional</p>
    
    <div class="typewriter-container">
      <span id="typewriter-text"></span>
    </div>
    
    <div class="nav-buttons">
      <a href="personal.html" class="nav-btn">Personal Information</a>
      <a href="achievements.html" class="nav-btn">Achievements</a>
      <a href="parents.html" class="nav-btn">My Parents</a>
    </div>
    
    <p class="footer-note">
      — <span>Building a future through dedication and dreams</span> —
    </p>
  </div>

  <script>
    const textLines = "Welcome to my portfolio\nA showcase of my journey, achievements, and dreams.";
    const speed = 60;
    let charIndex = 0;
    const typewriterElement = document.getElementById("typewriter-text");

    function typeWriter() {
      if (charIndex < textLines.length) {
        if (textLines.charAt(charIndex) === "\n") {
          typewriterElement.innerHTML += "<br>";
        } else {
          typewriterElement.textContent += textLines.charAt(charIndex);
        }
        charIndex++;
        setTimeout(typeWriter, speed);
      }
    }

    window.onload = function() {
      setTimeout(typeWriter, 800);
      createParticles();
    };

    function createParticles() {
      const container = document.getElementById("particles");
      const count = 35;
      
      for (let i = 0; i < count; i++) {
        const particle = document.createElement("div");
        particle.classList.add("particle");
        
        const size = Math.random() * 3 + 1;
        const posX = Math.random() * 100;
        const delay = Math.random() * 15;
        const duration = Math.random() * 10 + 12;
        
        particle.style.left = posX + "%";
        particle.style.width = size + "px";
        particle.style.height = size + "px";
        particle.style.animationDelay = delay + "s";
        particle.style.animationDuration = duration + "s";
        
        container.appendChild(particle);
      }
    }
  </script>
</body>
</html>
