<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma. Luisa Victoria S. Sanchez</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        /* 🌿 SOFT MINT GREEN BACKGROUND */
        body {
            background-color: #e8f5ee;
            background-image: linear-gradient(to bottom, #e8f5ee, #d9efdf);
            min-height: 100vh;
            color: #333333;
            line-height: 1.7;
        }

        nav {
            padding: 35px 20px;
            text-align: center;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        nav a {
            color: #47705b;
            text-decoration: none;
            margin: 0 22px;
            font-size: 15px;
            letter-spacing: 1px;
            text-transform: uppercase;
            position: relative;
            transition: color 0.3s ease;
        }

        nav a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1px;
            bottom: -5px;
            left: 50%;
            background-color: #47705b;
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }

        nav a:hover::after,
        nav a.active::after {
            width: 100%;
        }

        nav a:hover,
        nav a.active {
            color: #2f503f;
        }

        .hero {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 140px);
            padding: 30px 40px;
            gap: 70px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .photo-container {
            animation: fadeInLeft 1.2s ease-out;
        }

        @keyframes fadeInLeft {
            from { opacity: 0; transform: translateX(-40px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .photo-frame {
            width: 300px;
            height: 400px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(71, 112, 91, 0.15);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 4s ease;
        }

        .photo-frame:hover img {
            transform: scale(1.03);
        }

        .photo-frame:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 45px rgba(71, 112, 91, 0.22);
        }

        .text-content {
            animation: fadeInRight 1.2s ease-out;
        }

        @keyframes fadeInRight {
            from { opacity: 0; transform: translateX(40px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .full-name {
            font-size: 34px;
            color: #2f503f;
            line-height: 1.3;
            text-transform: uppercase;
            margin-bottom: 12px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 1s ease-out forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .subtitle {
            font-size: 15px;
            color: #5a856f;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeIn 1.5s ease-out both;
            animation-delay: 0.4s;
        }

        .divider-line {
            width: 60px;
            height: 2px;
            background-color: #78b494;
            margin-bottom: 25px;
            transform-origin: left;
            transform: scaleX(0);
            animation: expandLine 1.5s ease-out forwards;
            animation-delay: 0.6s;
        }

        @keyframes expandLine {
            from { transform: scaleX(0); }
            to { transform: scaleX(1); }
        }

        .tagline {
            font-size: 16px;
            font-style: italic;
            color: #47705b;
            margin-bottom: 35px;
            line-height: 1.8;
            opacity: 0;
            animation: fadeInUp 1.8s ease-out forwards;
            animation-delay: 0.8s;
        }

        .buttons-wrapper {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            opacity: 0;
            animation: fadeInUp 2s ease-out forwards;
            animation-delay: 1.1s;
        }

        .btn {
            padding: 12px 28px;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn-primary {
            background-color: #47705b;
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: #2f503f;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: transparent;
            color: #47705b;
            border: 1px solid #47705b;
        }

        .btn-secondary:hover {
            background-color: #47705b;
            color: #ffffff;
            transform: translateY(-2px);
        }

        @media (max-width: 900px) {
            .hero {
                flex-direction: column;
                text-align: center;
                gap: 45px;
            }
            .divider-line {
                margin: 0 auto 25px;
            }
            .buttons-wrapper {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="active">Home</a>
        <a href="personal.html">Personal Information</a>
        <a href="achievements.html">Achievements</a>
        <a href="parents.html">My Parents</a>
    </nav>

    <section class="hero">
        <div class="photo-container">
            <div class="photo-frame">
                <img src="6ac168f3-6031-4833-a875-8cf81e31b670.jfif" alt="Ma. Luisa Victoria S. Sanchez">
            </div>
        </div>

        <div class="text-content">
            <h1 class="full-name">Ma. Luisa Victoria S. Sanchez</h1>
            <p class="subtitle">IT Student & Future Professional</p>
            <div class="divider-line"></div>
            <p class="tagline">"Building IT Solutions, One System at a Time."</p>
            <div class="buttons-wrapper">
                <a href="personal.html" class="btn btn-primary">Get to Know Me</a>
                <a href="achievements.html" class="btn btn-secondary">See My Journey</a>
            </div>
        </div>
    </section>
</body>
</html>
