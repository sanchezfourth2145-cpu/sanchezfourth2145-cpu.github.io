<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ma. Luisa Victoria S. Sanchez — Portfolio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Georgia', 'Times New Roman', serif;
    }

    body {
      min-height: 100vh;
      background-color: #F9E7D8;
      background-image: radial-gradient(#E8C9B0 1px, transparent 1px);
      background-size: 30px 30px;
      color: #70422F;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .profile-img {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 4px solid #E8B996;
      object-fit: cover;
      margin-bottom: 30px;
      opacity: 0;
      animation: fadeIn 1.5s forwards ease-out;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    h1 {
      font-size: 2.2rem;
      text-align: center;
      letter-spacing: 2px;
      margin-bottom: 10px;
      border-right: 3px solid #70422F;
      padding-right: 8px;
      white-space: nowrap;
      overflow: hidden;
    }

    .subtitle {
      font-size: 1rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 40px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 1s forwards ease-out;
      animation-delay: 3.5s;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .welcome-text {
      text-align: center;
      font-size: 1.1rem;
      line-height: 1.8;
      margin-bottom: 50px;
      color: #8B5A3C;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 1s forwards ease-out;
      animation-delay: 4s;
    }

    .button-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 400px;
    }

    .btn {
      padding: 15px 30px;
      border-radius: 30px;
      font-size: 1.1rem;
      letter-spacing: 1px;
      text-decoration: none;
      text-align: center;
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
      opacity: 0;
      transform: translateY(20px);
    }

    .btn:nth-child(1) { animation: btnFade 0.8s forwards ease-out; animation-delay: 4.5s; }
    .btn:nth-child(2) { animation: btnFade 0.8s forwards ease-out; animation-delay: 5s; }
    .btn:nth-child(3) { animation: btnFade 0.8s forwards ease-out; animation-delay: 5.5s; }

    @keyframes btnFade {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .btn-primary {
      background-color: #E89F65;
      color: white;
    }

    .btn-primary:hover {
      background-color: #D88F55;
      transform: translateY(-2px);
    }

    .btn-outline {
      background-color: transparent;
      color: #70422F;
      border: 2px solid #D4A784;
    }

    .btn-outline:hover {
      background-color: #F2D4BC;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <img src="picture.jpg" alt="Ma. Luisa Victoria S. Sanchez" class="profile-img" />

  <h1 id="typewriter"></h1>

  <p class="subtitle">Aspiring IT Professional</p>

  <div class="welcome-text">
    Welcome to my portfolio<br>
    A showcase of my journey, achievements, and dreams.
  </div>

  <div class="button-container">
    <a href="personal.html" class="btn btn-primary">Personal Information</a>
    <a href="achievements.html" class="btn btn-outline">Achievements</a>
    <a href="parents.html" class="btn btn-outline">My Parents</a>
  </div>

  <script>
    const text = "Ma. Luisa Victoria S. Sanchez";
    const speed = 120; // milliseconds per letter
    let i = 0;

    function typeWriter() {
      if (i < text.length) {
        document.getElementById("typewriter").textContent += text.charAt(i);
        i++;
        setTimeout(typeWriter, speed);
      } else {
        // Remove cursor when done typing
        document.getElementById("typewriter").style.borderRight = "none";
      }
    }

    // Start typing when page loads
    window.onload = function() {
      setTimeout(typeWriter, 800);
    };
  </script>
</body>
</html>
