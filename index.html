<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ma. Luisa Victoria S. Sanchez — Portfolio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0a0f1f;
      color: #e6efff;
      padding: 60px 30px;
      position: relative;
      overflow-x: hidden;
    }

    .bg-gradient {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 90% 80%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(14, 165, 233, 0.04) 0%, transparent 60%);
      z-index: 0;
      animation: bgPulse 8s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes bgPulse {
      0% { opacity: 0.7; }
      100% { opacity: 1; }
    }

    .floating-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      z-index: 0;
      pointer-events: none;
    }

    .orb-1 {
      width: 500px;
      height: 500px;
      background: rgba(56, 189, 248, 0.12);
      top: -200px;
      right: -150px;
      animation: floatOrb1 15s ease-in-out infinite;
    }

    .orb-2 {
      width: 400px;
      height: 400px;
      background: rgba(99, 102, 241, 0.1);
      bottom: -100px;
      left: -100px;
      animation: floatOrb2 18s ease-in-out infinite;
    }

    @keyframes floatOrb1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(-80px, 60px) scale(1.1); }
      66% { transform: translate(40px, -40px) scale(0.95); }
    }

    @keyframes floatOrb2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(60px, -50px) scale(1.05); }
      75% { transform: translate(-60px, 30px) scale(0.9); }
    }

    .grid-lines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(56, 189, 248, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.03) 1px, transparent 1px);
      background-size: 80px 80px;
      z-index: 0;
      pointer-events: none;
    }

    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: rgba(125, 211, 252, 0.8);
      border-radius: 50%;
      box-shadow: 0 0 6px rgba(56, 189, 248, 0.5);
      animation: particleFloat 20s infinite linear;
    }

    @keyframes particleFloat {
      0% {
        transform: translateY(100vh) translateX(0);
        opacity: 0;
      }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% {
        transform: translateY(-100vh) translateX(50px);
        opacity: 0;
      }
    }

    .main-container {
      max-width: 600px;
      margin: 0 auto;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    /* ✅ YOUR PORTRAIT PHOTO SECTION */
    .profile-wrapper {
      position: relative;
      display: inline-block;
      margin-bottom: 30px;
      margin-top: 20px;
    }

    .profile-border {
      position: absolute;
      top: -6px;
      left: -6px;
      right: -6px;
      bottom: -6px;
      border-radius: 50%;
      background: linear-gradient(45deg, #38bdf8, #6366f1, #0ea5e9, #38bdf8);
      background-size: 300% 300%;
      animation: rotateBorder 3s linear infinite;
      z-index: -1;
    }

    @keyframes rotateBorder {
      0% { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    .profile-img {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #0a0f1f;
      opacity: 0;
      transform: scale(0.8);
      animation: profileFadeIn 1.2s forwards ease-out;
    }

    @keyframes profileFadeIn {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .name {
      font-size: 2.4rem;
      color: #ffffff;
      margin-bottom: 10px;
      letter-spacing: 2px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 1s forwards ease-out;
      animation-delay: 0.4s;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .title {
      font-size: 1rem;
      color: #7dd3fc;
      text-transform: uppercase;
      letter-spacing: 4px;
      margin-bottom: 35px;
      opacity: 0;
      animation: fadeIn 1s forwards ease-out;
      animation-delay: 0.7s;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .typewriter-container {
      min-height: 70px;
      margin-bottom: 45px;
      opacity: 0;
      animation: fadeIn 1s forwards ease-out;
      animation-delay: 1s;
    }

    #typewriter-text {
      font-size: 1.1rem;
      color: #bae6fd;
      border-right: 2px solid #38bdf8;
      padding-right: 6px;
      animation: blink 0.8s infinite;
      line-height: 1.6;
    }

    @keyframes blink {
      0%, 100% { border-color: #38bdf8; }
      50% { border-color: transparent; }
    }

    .nav-buttons {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 50px;
    }

    .nav-btn {
      padding: 18px 35px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 1.05rem;
      letter-spacing: 1px;
      position: relative;
      overflow: hidden;
      opacity: 0;
      transform: translateY(30px);
      animation: btnSlideUp 0.8s forwards ease-out;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border: 1px solid transparent;
    }

    .nav-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      transition: left 0.5s ease;
    }

    .nav-btn:hover::before {
      left: 100%;
    }

    .nav-btn:nth-child(1) {
      background: linear-gradient(135deg, #0c4a6e, #0369a1);
      color: white;
      animation-delay: 1.4s;
    }

    .nav-btn:nth-child(2) {
      background: transparent;
      color: #e0f2fe;
      border: 1px solid rgba(56, 189, 248, 0.3);
      animation-delay: 1.7s;
    }

    .nav-btn:nth-child(3) {
      background: transparent;
      color: #e0f2fe;
      border: 1px solid rgba(99, 102, 241, 0.3);
      animation-delay: 2.0s;
    }

    @keyframes btnSlideUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .nav-btn:nth-child(1):hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(14, 165, 233, 0.3);
      border-color: #38bdf8;
    }

    .nav-btn:nth-child(2):hover {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.08);
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(56, 189, 248, 0.15);
    }

    .nav-btn:nth-child(3):hover {
      border-color: #6366f1;
      background: rgba(99, 102, 241, 0.08);
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.15);
    }

    .footer-note {
      font-size: 0.9rem;
      color: #64748b;
      opacity: 0;
      animation: fadeIn 1s forwards ease-out;
      animation-delay: 2.6s;
    }

    .footer-note span {
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="floating-orb orb-1"></div>
  <div class="floating-orb orb-2"></div>
  <div class="grid-lines"></div>
  <div class="particles" id="particles"></div>

  <div class="main-container">
    <!-- ✅ YOUR PORTRAIT PHOTO IS HERE -->
    <div class="profile-wrapper">
      <div class="profile-border"></div>
      <img src="profile.jpg" alt="Ma. Luisa Victoria S. Sanchez" class="profile-img" />
    </div>
    
    <h1 class="name">Ma. Luisa Victoria S. Sanchez</h1>
    <p class="title">ASPIRING IT PROFESSIONAL</p>
    
    <div class="typewriter-container">
      <span id="typewriter-text"></span>
    </div>
    
    <div class="nav-buttons">
      <a href="personal.html" class="nav-btn">Personal Information</a>
      <a href="achievements.html" class="nav-btn">Achievements</a>
      <a href="parents.html" class="nav-btn">My Parents</a>
    </div>
    
    <p class="footer-note">
      — <span>Building the future, one system at a time</span> —
    </p>
  </div>

  <script>
    const textLines = "Welcome to my portfolio. A showcase of my journey, achievements, and dreams.";
    const speed = 60;
    let charIndex = 0;
    const typewriterElement = document.getElementById("typewriter-text");

    function typeWriter() {
      if (charIndex < textLines.length) {
        if (textLines.charAt(charIndex) === "\n") {
          typewriterElement.innerHTML += "<br>";
        } else {
          typewriterElement.textContent += textLines.charAt(charIndex);
        }
        charIndex++;
        setTimeout(typeWriter, speed);
      }
    }

    window.onload = function() {
      setTimeout(typeWriter, 800);
      createParticles();
    };

    function createParticles() {
      const container = document.getElementById("particles");
      const count = 60;
      
      for (let i = 0; i < count; i++) {
        const particle = document.createElement("div");
        particle.classList.add("particle");
        
        const size = Math.random() * 3 + 1;
        const posX = Math.random() * 100;
        const delay = Math.random() * 20;
        const duration = Math.random() * 15 + 15;
        
        particle.style.left = posX + "%";
        particle.style.width = size + "px";
        particle.style.height = size + "px";
        particle.style.animationDelay = delay + "s";
        particle.style.animationDuration = duration + "s";
        
        container.appendChild(particle);
      }
    }
  </script>
</body>
</html>
