<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ma. Luisa Victoria S. Sanchez — Portfolio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Georgia', 'Times New Roman', serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(90deg, #F6C9B8 0%, #F9E7DC 50%, #F6C9B8 100%);
      background-size: 100% 100%;
      color: #70422F;
      overflow-x: hidden;
      position: relative;
    }

    body::before,
    body::after {
      content: '';
      position: fixed;
      top: 0;
      bottom: 0;
      width: 12%;
      background: #F2A68A;
      z-index: 0;
      opacity: 0;
      animation: sideFadeIn 1.5s forwards ease-out;
    }

    body::before {
      left: 0;
      animation-delay: 0.2s;
    }

    body::after {
      right: 0;
      animation-delay: 0.4s;
    }

    @keyframes sideFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .home-container {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 30px;
      text-align: center;
    }

    .profile-frame {
      position: relative;
      width: 200px;
      height: 200px;
      margin-bottom: 35px;
      opacity: 0;
      transform: scale(0.8);
      animation: popIn 1.2s forwards ease-out;
      animation-delay: 0.6s;
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .profile-frame::before {
      content: '';
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      background: linear-gradient(135deg, #F2A68A, #F6C9B8, #F9E7DC, #F6C9B8, #F2A68A);
      background-size: 300% 300%;
      animation: borderRotate 5s linear infinite;
      z-index: -1;
    }

    @keyframes borderRotate {
      0% { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    .profile-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      object-position: center;
      border: 6px solid #F9E7DC;
    }

    h1 {
      font-size: 2.5rem;
      color: #70422F;
      letter-spacing: 2px;
      margin-bottom: 10px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 1s forwards ease-out;
      animation-delay: 0.9s;
    }

    .tagline {
      font-size: 1.1rem;
      color: #A06650;
      text-transform: uppercase;
      letter-spacing: 4px;
      margin-bottom: 20px;
      opacity: 0;
      transform: translateY(15px);
      animation: fadeUp 1s forwards ease-out;
      animation-delay: 1.1s;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .divider {
      width: 120px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #F2A68A, #F6C9B8, #F2A68A, transparent);
      margin: 0 auto 30px;
      opacity: 0;
      transform: scaleX(0);
      animation: lineGrow 1s forwards ease-out;
      animation-delay: 1.3s;
    }

    @keyframes lineGrow {
      from {
        opacity: 0;
        transform: scaleX(0);
      }
      to {
        opacity: 1;
        transform: scaleX(1);
      }
    }

    .welcome-text {
      font-size: 1.15rem;
      color: #7A4B3C;
      line-height: 1.8;
      margin-bottom: 45px;
      opacity: 0;
      transform: translateY(15px);
      animation: fadeUp 1s forwards ease-out;
      animation-delay: 1.5s;
    }

    .btn {
      display: inline-block;
      padding: 16px 45px;
      background: linear-gradient(135deg, #F2A68A, #E89878);
      color: #fff;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 1px;
      border-radius: 50px;
      text-decoration: none;
      box-shadow: 0 6px 20px rgba(242, 166, 138, 0.3);
      transition: all 0.4s ease;
      opacity: 0;
      transform: translateY(15px);
      animation: fadeUp 1s forwards ease-out;
      animation-delay: 1.8s;
    }

    .btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 30px rgba(242, 166, 138, 0.4);
    }

    .btn-group {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      opacity: 0;
      animation: fadeUp 1s forwards ease-out;
      animation-delay: 1.8s;
    }

    .btn-secondary {
      background: transparent;
      color: #F2A68A;
      border: 2px solid #F2A68A;
      box-shadow: none;
    }

    .btn-secondary:hover {
      background: #F9E7DC;
      color: #70422F;
    }
  </style>
</head>
<body>
  <div class="home-container">
    <div class="profile-frame">
      <img src="3d9d3e50-22d4-4faa-a470-c40b6427f6c0.jfif" alt="Ma. Luisa Victoria S. Sanchez" class="profile-img" />
    </div>

    <h1>Ma. Luisa Victoria S. Sanchez</h1>
    <p class="tagline">Aspiring IT Professional</p>

    <div class="divider"></div>

    <div class="welcome-text">
      Welcome to my portfolio <br>
      A showcase of my journey, achievements, and dreams.
    </div>

    <div class="btn-group">
      <a href="personal.html" class="btn">Personal Information</a>
      <a href="achievements.html" class="btn btn-secondary">Achievements</a>
    </div>
  </div>
</body>
</html>
