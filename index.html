<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Ma. Luisa Victoria S. Sanchez</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Times New Roman', serif;
        }
        body {
            background: linear-gradient(135deg, #2c2c2c 0%, #444444 100%);
            min-height: 100vh;
            color: #fff;
        }
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(44, 44, 44, 0.95);
            z-index: 100;
        }
        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            color: #a8c7e1;
            letter-spacing: 2px;
        }
        .nav-links a {
            color: #ddd;
            text-decoration: none;
            margin-left: 30px;
            font-size: 1rem;
        }
        .nav-links a:hover, .nav-links a.active {
            color: #a8c7e1;
        }
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 50px 50px;
            gap: 60px;
            flex-wrap: wrap;
        }
        .profile-img-container {
            position: relative;
        }
        .profile-img-container::before {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border: 3px solid #a8c7e1;
        }
        .profile-img {
            width: 320px;
            height: 400px;
            object-fit: cover;
            display: block;
        }
        .hero-text {
            flex: 1;
            min-width: 350px;
        }
        .hero-text h1 {
            font-size: 2.5rem;
            letter-spacing: 4px;
            margin-bottom: 15px;
        }
        .hero-text h2 {
            font-size: 1rem;
            color: #a8c7e1;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .tagline {
            font-size: 1.1rem;
            font-style: italic;
            color: #ccc;
            border-left: 2px solid #a8c7e1;
            padding-left: 15px;
            margin-bottom: 30px;
        }
        .buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 28px;
            border-radius: 4px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
        }
        .btn-primary {
            background: #a8c7e1;
            color: #2c2c2c;
        }
        .btn-secondary {
            background: transparent;
            color: #fff;
            border: 1px solid #fff;
        }
        @media (max-width: 900px) {
            .hero { text-align: center; padding: 100px 20px 40px; }
            .tagline { border-left: none; border-top: 2px solid #a8c7e1; padding-left: 0; padding-top: 15px; }
            .buttons { justify-content: center; }
            nav { padding: 15px 20px; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">MLVS</div>
        <div class="nav-links">
            <a href="index.html" class="active">Home</a>
            <a href="personal.html">Personal Information</a>
            <a href="achievements.html">Achievements</a>
            <a href="parents.html">My Parents</a>
        </div>
    </nav>

    <section class="hero">
        <div class="profile-img-container">
            <!-- ✅ PERFECT MATCH to your filename -->
            <img src="6ac168f3-6031-4833-a875-8cf81e31b670.jfif" alt="Ma. Luisa Victoria S. Sanchez" class="profile-img">
        </div>
        <div class="hero-text">
            <h1>MA. LUISA VICTORIA S. SANCHEZ</h1>
            <h2>BACHELOR OF SCIENCE IN INFORMATION TECHNOLOGY<br>ENTERPRISE RESOURCES AND PLANNING TRACK</h2>
            <p class="tagline">"Building IT Solutions, One System at a Time."</p>
            <div class="buttons">
                <a href="personal.html" class="btn btn-primary">Get to Know Me →</a>
                <a href="achievements.html" class="btn btn-secondary">See My Journey</a>
            </div>
        </div>
    </section>
</body>
</html>
