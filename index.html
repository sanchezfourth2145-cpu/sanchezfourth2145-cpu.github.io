<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma. Luisa Victoria S. Sanchez</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        body {
            background-color: #f8faf7;
            min-height: 100vh;
            color: #3a3a3a;
            line-height: 1.7;
            overflow-x: hidden;
        }

        /* Soft floating background shapes */
        .floating-circle {
            position: fixed;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(95, 115, 103, 0.08), transparent 70%);
            z-index: -1;
            animation: gentleFloat 20s ease-in-out infinite;
        }

        .circle-1 {
            width: 450px;
            height: 450px;
            top: -200px;
            right: -100px;
        }

        .circle-2 {
            width: 350px;
            height: 350px;
            bottom: -150px;
            left: -100px;
            animation-delay: -10s;
        }

        .circle-3 {
            width: 250px;
            height: 250px;
            top: 20%;
            right: 15%;
            opacity: 0.5;
            animation-delay: -5s;
        }

        @keyframes gentleFloat {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -20px) rotate(8deg); }
            66% { transform: translate(-20px, 25px) rotate(-8deg); }
        }

        /* Navigation */
        nav {
            padding: 35px 20px;
            text-align: center;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        nav a {
            color: #5f7367;
            text-decoration: none;
            margin: 0 22px;
            font-size: 15px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            position: relative;
            transition: color 0.4s ease;
        }

        nav a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1px;
            bottom: -5px;
            left: 50%;
            background-color: #5f7367;
            transition: all 0.4s ease;
            transform: translateX(-50%);
        }

        nav a:hover::after,
        nav a.active::after {
            width: 100%;
        }

        nav a:hover,
        nav a.active {
            color: #3a483e;
        }

        /* Hero Section */
        .hero {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 140px);
            padding: 30px 40px;
            gap: 60px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .photo-container {
            position: relative;
            animation: fadeInLeft 1.2s ease-out;
            flex-shrink: 0;
        }

        @keyframes fadeInLeft {
            from { opacity: 0; transform: translateX(-40px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Clean photo frame — NO gold, NO school text */
        .photo-frame {
            width: 300px;
            height: 400px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(95, 115, 103, 0.15);
            transition: transform 0.5s ease, box-shadow 0.5s ease;
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 6s ease;
        }

        .photo-frame:hover img {
            transform: scale(1.06);
        }

        .photo-frame:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 50px rgba(95, 115, 103, 0.2);
        }

        /* Shimmer effect on photo */
        .photo-frame::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.3),
                transparent
            );
            z-index: 2;
            transition: left 0.7s ease;
        }

        .photo-frame:hover::before {
            left: 100%;
        }

        .text-content {
            flex: 1;
            animation: fadeInRight 1.2s ease-out;
        }

        @keyframes fadeInRight {
            from { opacity: 0; transform: translateX(40px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* ✨ YOUR FULL NAME — BEAUTIFUL ANIMATIONS ✨ */
        .text-content h1 {
            font-size: 44px;
            letter-spacing: 4px;
            text-transform: uppercase;
            line-height: 1.3;
            margin-bottom: 10px;
            overflow: hidden;
        }

        .name-char {
            display: inline-block;
            opacity: 0;
            transform: translateY(20px);
            animation: letterFadeUp 0.6s ease-out forwards;
        }

        @keyframes letterFadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Continuous soft shimmer across full name */
        .name-wrapper {
            position: relative;
            display: inline-block;
        }

        .name-wrapper::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(95, 115, 103, 0.15),
                transparent
            );
            animation: nameShimmer 4s ease-in-out infinite;
            animation-delay: 2s;
        }

        @keyframes nameShimmer {
            0% { left: -100%; }
            50%, 100% { left: 100%; }
        }

        /* Gentle glow when hovering name */
        .name-wrapper:hover {
            animation: nameGlow 2s ease-in-out infinite;
            cursor: default;
        }

        @keyframes nameGlow {
            0%, 100% { text-shadow: none; }
            50% { text-shadow: 0 0 20px rgba(95, 115, 103, 0.2); }
        }

        .subtitle {
            font-size: 15px;
            color: #7a8a7f;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeIn 1.5s ease-out both;
            animation-delay: 0.8s;
        }

        .divider-line {
            width: 70px;
            height: 2px;
            background-color: #5f7367;
            margin-bottom: 25px;
            transform-origin: left;
            transform: scaleX(0);
            animation: expandLine 1.5s ease-out forwards;
            animation-delay: 1s;
        }

        @keyframes expandLine {
            from { transform: scaleX(0); }
            to { transform: scaleX(1); }
        }

        .tagline {
            font-size: 17px;
            font-style: italic;
            color: #6b7b6f;
            margin-bottom: 40px;
            line-height: 1.8;
            opacity: 0;
            animation: fadeInUp 1.8s ease-out forwards;
            animation-delay: 1.3s;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .buttons-wrapper {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            opacity: 0;
            animation: fadeInUp 2s ease-out forwards;
            animation-delay: 1.6s;
        }

        .btn {
            padding: 13px 32px;
            font-size: 14px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.4s ease;
            cursor: pointer;
            white-space: nowrap;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background-color: #5f7367;
            color: #ffffff;
            border: 2px solid #5f7367;
        }

        .btn-primary:hover {
            background-color: #4a5c4f;
            border-color: #4a5c4f;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(95, 115, 103, 0.25);
        }

        .btn-secondary {
            background-color: transparent;
            color: #5f7367;
            border: 2px solid #5f7367;
        }

        .btn-secondary:hover {
            background-color: #5f7367;
            color: #ffffff;
            transform: translateY(-3px);
        }

        /* Button shimmer effect */
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.2),
                transparent
            );
            transition: left 0.5s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .hero {
                flex-direction: column;
                text-align: center;
                gap: 50px;
            }

            .divider-line {
                margin: 0 auto 25px;
            }

            .buttons-wrapper {
                justify-content: center;
            }

            .text-content h1 {
                font-size: 34px;
            }
        }

        @media (max-width: 480px) {
            nav {
                padding: 25px 15px;
            }

            nav a {
                margin: 0 10px;
                font-size: 13px;
            }

            .photo-frame {
                width: 250px;
                height: 340px;
            }

            .text-content h1 {
                font-size: 26px;
            }

            .btn {
                padding: 11px 24px;
                font-size: 13px;
            }
        }
    </style>
</head>
