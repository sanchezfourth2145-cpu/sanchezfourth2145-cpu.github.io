<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma. Luisa Victoria S. Sanchez</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        body {
            background-color: #f8faf7;
            min-height: 100vh;
            color: #3a3a3a;
            line-height: 1.7;
            overflow-x: hidden;
        }

        /* Soft floating background shapes */
        .floating-circle {
            position: fixed;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(184, 169, 143, 0.12), transparent 70%);
            z-index: -1;
            animation: gentleFloat 18s ease-in-out infinite;
        }

        .circle-1 {
            width: 400px;
            height: 400px;
            top: -150px;
            right: -100px;
        }

        .circle-2 {
            width: 300px;
            height: 300px;
            bottom: -100px;
            left: -80px;
            animation-delay: -9s;
        }

        .circle-3 {
            width: 200px;
            height: 200px;
            top: 30%;
            left: 10%;
            opacity: 0.6;
            animation-delay: -5s;
        }

        @keyframes gentleFloat {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(25px, -15px) rotate(5deg); }
            66% { transform: translate(-15px, 20px) rotate(-5deg); }
        }

        /* Navigation */
        nav {
            padding: 35px 20px;
            text-align: center;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        nav a {
            color: #5f7367;
            text-decoration: none;
            margin: 0 18px;
            font-size: 15px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            position: relative;
            transition: color 0.4s ease;
        }

        nav a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1px;
            bottom: -5px;
            left: 50%;
            background-color: #b8a98f;
            transition: all 0.4s ease;
            transform: translateX(-50%);
        }

        nav a:hover::after,
        nav a.active::after {
            width: 100%;
        }

        nav a:hover,
        nav a.active {
            color: #3a483e;
        }

        /* Hero Section */
        .hero {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 140px);
            padding: 30px 40px;
            gap: 50px;
            max-width: 950px;
            margin: 0 auto;
        }

        .photo-container {
            position: relative;
            animation: fadeInLeft 1.2s ease-out;
            flex-shrink: 0;
        }

        @keyframes fadeInLeft {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .photo-frame {
            width: 280px;
            height: 370px;
            overflow: hidden;
            box-shadow: 0 15px 50px rgba(95, 115, 103, 0.12);
            transition: transform 0.6s ease, box-shadow 0.6s ease;
            position: relative;
            z-index: 2;
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 8s ease, filter 0.6s ease;
        }

        .photo-frame:hover img {
            transform: scale(1.05);
            filter: brightness(1.02) contrast(1.02);
        }

        .photo-frame:hover {
            transform: translateY(-6px);
            box-shadow: 0 25px 60px rgba(95, 115, 103, 0.18);
        }

        .photo-accent {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 100%;
            height: 100%;
            border: 2px solid #b8a98f;
            z-index: 1;
            transition: all 0.5s ease;
        }

        .photo-container:hover .photo-accent {
            top: 8px;
            left: 8px;
        }

        /* Soft shimmer line on photo */
        .photo-frame::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.25),
                transparent
            );
            z-index: 3;
            transition: left 0.8s ease;
        }

        .photo-frame:hover::before {
            left: 100%;
        }

        .text-content {
            flex: 1;
            animation: fadeInRight 1.2s ease-out;
        }

        @keyframes fadeInRight {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* ✨ YOUR NAME — WITH ANIMATIONS ✨ */
        .text-content h1 {
            font-size: 42px;
            letter-spacing: 3px;
            text-transform: uppercase;
            line-height: 1.3;
            margin-bottom: 5px;
            overflow: hidden;
        }

        .line-1 {
            display: inline-block;
            color: #5f7367;
            opacity: 0;
            transform: translateY(30px);
            animation: slideUpFade 1.2s ease-out forwards;
        }

        .line-2 {
            display: inline-block;
            color: #b8a98f;
            opacity: 0;
            transform: translateY(30px);
            animation: slideUpFade 1.2s ease-out forwards;
            animation-delay: 0.35s;
            position: relative;
        }

        /* Shimmer effect on the second line */
        .line-2::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.4),
                transparent
            );
            animation: nameShimmer 3s ease-in-out infinite;
            animation-delay: 1.5s;
        }

        @keyframes slideUpFade {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes nameShimmer {
            0% { left: -100%; }
            50%, 100% { left: 100%; }
        }

        /* Gentle glow pulse on hover */
        .text-content h1:hover .line-2 {
            animation: gentlePulse 2s ease-in-out infinite;
            cursor: default;
        }

        @keyframes gentlePulse {
            0%, 100% { text-shadow: none; }
            50% { text-shadow: 0 0 15px rgba(184, 169, 143, 0.3); }
        }

        .subtitle {
            font-size: 15px;
            color: #7a8a7f;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeIn 1.5s ease-out both;
            animation-delay: 0.7s;
        }

        .divider-line {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, #5f7367, #b8a98f, #5f7367);
            background-size: 200% 100%;
            margin-bottom: 25px;
            animation: expandLine 1.5s ease-out forwards, shimmerLine 3s linear infinite;
            animation-delay: 0.9s, 1.5s;
            transform-origin: left;
            opacity: 0;
        }

        @keyframes expandLine {
            from {
                transform: scaleX(0);
                opacity: 1;
            }
            to {
                transform: scaleX(1);
                opacity: 1;
            }
        }

        @keyframes shimmerLine {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .tagline {
            font-size: 17px;
            font-style: italic;
            color: #6b7b6f;
            margin-bottom: 35px;
            line-height: 1.8;
            opacity: 0;
            animation: fadeInUp 1.8s ease-out forwards;
            animation-delay: 1.1s;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .buttons-wrapper {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            opacity: 0;
            animation: fadeInUp 2s ease-out forwards;
            animation-delay: 1.5s;
        }

        .btn {
            padding: 12px 28px;
            font-size: 14px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.4s ease;
            cursor: pointer;
            white-space: nowrap;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background-color: #5f7367;
            color: #ffffff;
            border: 2px solid #5f7367;
        }

        .btn-primary:hover {
            background-color: #4a5c4f;
            border-color: #4a5c4f;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(95, 115, 103, 0.25);
        }

        .btn-secondary {
            background-color: transparent;
            color: #5f7367;
            border: 2px solid #b8a98f;
        }

        .btn-secondary:hover {
            background-color: #b8a98f;
            color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(184, 169, 143, 0.25);
        }

        /* Button shimmer effect */
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.2),
                transparent
            );
            transition: left 0.5s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .hero {
                flex-direction: column;
                text-align: center;
                gap: 50px;
            }

            .divider-line {
                margin: 0 auto 25px;
            }

            .buttons-wrapper {
                justify-content: center;
            }

            .text-content h1 {
                font-size: 36px;
            }
        }

        @media (max-width: 480px) {
            nav {
                padding: 25px 15px;
            }

            nav a {
                margin: 0 10px;
                font-size: 13px;
            }

            .photo-frame {
                width: 240px;
                height: 320px;
            }

            .text-content h1 {
                font-size: 28px;
            }

            .btn {
                padding: 10px 22px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <!-- Floating background shapes -->
    <div class="floating-circle circle-1"></div>
    <div class="floating-circle circle-2"></div>
    <div class="floating-circle circle-3"></div>

    <!-- Navigation -->
    <nav>
        <a href="index.html" class="active">Home</a>
        <a href="personal.html">Personal Information</a>
        <a href="achievements.html">Achievements</a>
        <a href="parents.html">My Parents</a>
    </nav>

    <!-- Main Hero Section -->
    <section class="hero">
        <div class="photo-container">
            <div class="photo-frame">
                <img src="your-photo.jpg" alt="Ma. Luisa Victoria S. Sanchez">
            </div>
            <div class="photo-accent"></div>
        </div>

        <div class="text-content">
            <h1>
                <span class="line-1">Ma. Luisa Victoria</span><br>
                <span class="line-2">S. Sanchez</span>
            </h1>
            <p class="subtitle">IT Student & Future Professional</p>
            <div class="divider-line"></div>
            <p class="tagline">"Building IT Solutions, One System at a Time."</p>
            <div class="buttons-wrapper">
                <a href="personal.html" class="btn btn-primary">Get to Know Me</a>
                <a href="achievements.html" class="btn btn-secondary">See My Journey</a>
            </div>
        </div>
    </section>
</body>
</html>
