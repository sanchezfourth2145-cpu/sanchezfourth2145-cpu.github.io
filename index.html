<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Ma. Luisa Victoria S. Sanchez</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Inter', sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #020617 0%, #0f172a 50%, #020617 100%);
            color: #e0f2fe;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }
        .dot {
            position: absolute;
            background-color: rgba(147, 197, 253, 0.6);
            border-radius: 50%;
            animation: rise 8s ease-out forwards;
        }
        @keyframes rise {
            0% {
                transform: translateY(100vh);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px);
                opacity: 0;
            }
        }
        .wrapper {
            display: flex;
            align-items: center;
            gap: 60px;
            z-index: 10;
        }
        .profile-img-container {
            width: 320px;
            height: 520px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(96, 165, 250, 0.35);
            animation: fadeInLeft 1.2s ease forwards;
        }
        @keyframes fadeInLeft{
            0%{transform:translateX(-40px);opacity:0;}
            100%{transform:translateX(0);opacity:1;}
        }
        .profile-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
        }
        .text-area {
            text-align: center;
            animation: fadeInRight 1.2s ease forwards;
        }
        @keyframes fadeInRight{
            0%{transform:translateX(40px);opacity:0;}
            100%{transform:translateX(0);opacity:1;}
        }
        .small-heading {
            font-size: 18px;
            letter-spacing: 3px;
            color: #bae6fd;
            margin-bottom: 12px;
        }
        h1 {
            font-size: 42px;
            margin-bottom: 12px;
            color:#ffffff;
        }
        .subtitle {
            font-size: 16px;
            color: #cbd5e1;
            margin-bottom: 35px;
        }
        .explore-btn {
            padding: 12px 26px;
            border: none;
            border-radius: 30px;
            background-color: #38bdf8;
            color: #020617;
            font-weight: bold;
            font-size:15px;
            cursor: pointer;
            margin-bottom:45px;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .explore-btn:hover{
            transform: translateY(-3px);
            box-shadow:0 6px 18px rgba(56,189,248,0.45);
        }
        .cards-container {
            display: flex;
            gap:25px;
        }
        .card-link {
            text-decoration: none;
        }
        .card {
            width: 210px;
            padding:22px 15px;
            border:1px solid rgba(148,163,184,0.4);
            border-radius:14px;
            background-color: rgba(15,23,42,0.55);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .card:hover{
            transform: translateY(-4px);
            box-shadow:0 5px 16px rgba(96,165,250,0.3);
        }
        .card h3 {
            color:white;
            font-size:17px;
            margin-bottom:8px;
        }
        .card p {
            color:#cbd5e1;
            font-size:13px;
        }
        .cursor{
            display:inline-block;
            width:3px;
            height:22px;
            background:#38bdf8;
            animation: blink 0.7s infinite;
        }
        @keyframes blink{
            0%,100%{opacity:1;}
            50%{opacity:0;}
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="profile-img-container">
            <img src="formalwhole.jpg" alt="Ma. Luisa Victoria S. Sanchez">
        </div>
        <div class="text-area">
            <p class="small-heading"><span id="line1"></span><span class="cursor"></span></p>
            <h1><span id="line2"></span></h1>
            <p class="subtitle"><span id="line3"></span></p>
            <button class="explore-btn">Explore My Work →</button>
            <div class="cards-container">
                <a href="personal.html" class="card-link">
                    <div class="card">
                        <h3>Personal Information</h3>
                        <p>Get to know my background, education, and skills</p>
                    </div>
                </a>
                <a href="achievements.html" class="card-link">
                    <div class="card">
                        <h3>Achievements</h3>
                        <p>My awards, certifications, and milestones</p>
                    </div>
                </a>
                <a href="myfamilyandfriends.html" class="card-link">
                    <div class="card">
                        <h3>My Family and Friends</h3>
                        <p>Dedicated to the people who made it all possible</p>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <script>
        function createDot(){
            const dot = document.createElement('div');
            dot.classList.add('dot');
            const size = Math.random() * 4 + 1;
            dot.style.width = size + 'px';
            dot.style.height = size + 'px';
            dot.style.left = Math.random() * 100 + '%';
            document.body.appendChild(dot);
            setTimeout(() => dot.remove(), 8000);
        }
        setInterval(createDot, 250);

        const text1 = "HELLO, I'M";
        const text2 = "Ma. Luisa Victoria S. Sanchez";
        const text3 = "An aspiring IT professional building digital solutions for tomorrow's world";
        let i1=0,i2=0,i3=0;
        const speed = 55;

        function typeLine1(){
            if(i1 < text1.length){
                document.getElementById("line1").innerText += text1.charAt(i1);
                i1++;
                setTimeout(typeLine1,speed);
            }else{
                setTimeout(typeLine2,350);
            }
        }
        function typeLine2(){
            if(i2 < text2.length){
                document.getElementById("line2").innerText += text2.charAt(i2);
                i2++;
                setTimeout(typeLine2,speed);
            }else{
                setTimeout(typeLine3,350);
            }
        }
        function typeLine3(){
            if(i3 < text3.length){
                document.getElementById("line3").innerText += text3.charAt(i3);
                i3++;
                setTimeout(typeLine3,speed);
            }
        }
        typeLine1();
    </script>
</body>
</html>
