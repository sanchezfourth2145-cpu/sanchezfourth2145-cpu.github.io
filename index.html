<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma. Luisa Victoria S. Sanchez</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Georgia', 'Times New Roman', serif;
        }
        body {
            background-color: #f8faf7;
            min-height: 100vh;
            color: #3a3a3a;
            line-height: 1.7;
            overflow-x: hidden;
        }
        /* Navigation — soft fade in */
        nav {
            padding: 30px 40px;
            text-align: center;
            animation: fadeIn 1s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        nav a {
            color: #5f7367;
            text-decoration: none;
            margin: 0 22px;
            font-size: 16px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            position: relative;
            transition: color 0.4s ease;
        }
        nav a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1px;
            bottom: -5px;
            left: 50%;
            background-color: #b8a98f;
            transition: all 0.4s ease;
            transform: translateX(-50%);
        }
        nav a:hover::after, nav a.active::after {
            width: 100%;
        }
        nav a:hover, nav a.active {
            color: #3a483e;
        }
        /* Hero Section — centered, elegant */
        .hero {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 120px);
            padding: 40px;
            gap: 60px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .photo-container {
            position: relative;
            animation: fadeInLeft 1.2s ease-out;
        }
        @keyframes fadeInLeft {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .photo-frame {
            width: 320px;
            height: 400px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(95, 115, 103, 0.15);
            transition: transform 0.6s ease, box-shadow 0.6s ease;
        }
        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 8s ease;
        }
        .photo-frame:hover img {
            transform: scale(1.08);
        }
        .photo-frame:hover {
            transform: translateY(-8px);
            box-shadow: 0 30px 70px rgba(95, 115, 103, 0.2);
        }
        .photo-accent {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 100%;
            height: 100%;
            border: 2px solid #b8a98f;
            z-index: -1;
            transition: all 0.5s ease;
        }
        .photo-container:hover .photo-accent {
            top: 12px;
            left: 12px;
        }
        .text-content {
            flex: 1;
            animation: fadeInRight 1.2s ease-out;
        }
        @keyframes fadeInRight {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .text-content h1 {
            font-size: 48px;
            color: #5f7367;
            letter-spacing: 4px;
            text-transform: uppercase;
            line-height: 1.2;
            margin-bottom: 10px;
        }
        .text-content h1 span {
            color: #b8a98f;
        }
        .subtitle {
            font-size: 16px;
            color: #7a8a7f;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 25px;
        }
        .divider-line {
            width: 60px;
            height: 2px;
            background-color: #b8a98f;
            margin-bottom: 30px;
            animation: expandLine 1.5s ease-out forwards;
            transform-origin: left;
        }
        @keyframes expandLine {
            from { transform: scaleX(0); }
            to { transform: scaleX(1); }
        }
        .tagline {
            font-size: 18px;
            font-style: italic;
            color: #6b7b6f;
            margin-bottom: 45px;
            line-height: 1.8;
        }
        .buttons-wrapper {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 14px 36px;
            font-size: 15px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.4s ease;
            cursor: pointer;
        }
        .btn-primary {
            background-color: #5f7367;
            color: #ffffff;
            border: 2px solid #5f7367;
        }
        .btn-primary:hover {
            background-color: #4a5c4f;
            border-color: #4a5c4f;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(95, 115, 103, 0.25);
        }
        .btn-secondary {
            background-color: transparent;
            color: #5f7367;
            border: 2px solid #b8a98f;
        }
        .btn-secondary:hover {
            background-color: #b8a98f;
            color: #ffffff;
            transform: translateY(-3px);
        }
        /* Soft floating shapes — like your sister's gentle background */
        .floating-circle {
            position: fixed;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(184, 169, 143, 0.12), transparent 70%);
            z-index: -1;
            animation: gentleFloat 18s ease-in-out infinite;
        }
        .circle-1 {
            width: 400px;
            height: 400px;
            top: -150px;
            right: -100px;
        }
        .circle-2 {
            width: 300px;
            height: 300px;
            bottom: -100px;
            left: -80px;
            animation-delay: -9s;
        }
        @keyframes gentleFloat {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(25px, -15px) rotate(5deg); }
            66% { transform: translate(-15px, 20px) rotate(-5deg); }
        }
        /* Responsive */
        @media (max-width: 900px) {
            .hero {
                flex-direction: column;
                text-align: center;
                gap: 50px;
            }
            .divider-line {
                margin: 0 auto 30px;
            }
            .buttons-wrapper {
                justify-content: center;
            }
            .text-content h1 {
                font-size: 36px;
            }
        }
        @media (max-width: 480px) {
            nav { padding: 20px; }
            nav a { margin: 0 10px; font-size: 14px; }
            .photo-frame { width: 260px; height: 340px; }
            .text-content h1 { font-size: 28px; }
        }
    </style>
</head>
<body>
    <!-- Floating soft shapes like your sister's design -->
    <div class="floating-circle circle-1"></div>
    <div class="floating-circle circle-2"></div>

    <!-- Navigation -->
    <nav>
        <a href="index.html" class="active">Home</a>
        <a href="personal.html">Personal Information</a>
        <a href="achievements.html">Achievements</a>
        <a href="parents.html">My Parents</a>
    </nav>

    <!-- Main Hero Section -->
    <section class="hero">
        <div class="photo-container">
            <div class="photo-frame">
                <img src="6ac168f3-6031-4833-a875-8cf81e31b670.jfif" alt="Ma. Luisa Victoria S. Sanchez">
            </div>
            <div class="photo-accent"></div>
        </div>

        <div class="text-content">
            <h1>Ma. Luisa Victoria<br><span>S. Sanchez</span></h1>
            <p class="subtitle">IT Student & Future Professional</p>
            <div class="divider-line"></div>
            <p class="tagline">"Building IT Solutions, One System at a Time."</p>
            <div class="buttons-wrapper">
                <a href="personal.html" class="btn btn-primary">Get to Know Me</a>
                <a href="achievements.html" class="btn btn-secondary">See My Journey</a>
            </div>
        </div>
    </section>
</body>
</html>
