<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Ma. Luisa Victoria S. Sanchez</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Inter', sans-serif;
        }
        body {
            min-height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #020617 0%, #0c2240 50%, #020617 100%);
            color: #e0f2fe;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding:40px;
        }
        .dot {
            position: absolute;
            background-color: rgba(147,197,253,0.6);
            border-radius:50%;
            animation: rise 9s linear infinite;
        }
        @keyframes rise {
            0%{transform: translateY(100vh); opacity:0;}
            15%{opacity:1;}
            85%{opacity:1;}
            100%{transform: translateY(-120px); opacity:0;}
        }
        .container{
            display:flex;
            align-items:center;
            gap:75px;
            z-index:10;
        }
        .profileBox{
            width:340px;
            height:550px;
            border-radius:24px;
            overflow:hidden;
            box-shadow: 0 0 40px rgba(56,189,248,0.42);
        }
        .profileBox img{
            width:100%;
            height:100%;
            object-fit:cover;
        }
        .textArea{
            text-align:center;
        }
        .greeting{
            font-size:22px;
            letter-spacing:4px;
            color:#bae6fd;
            margin-bottom:16px;
        }
        .fullName{
            font-size:48px;
            color:#ffffff;
            text-shadow: 0 0 10px rgba(255,255,255,0.35);
            margin-bottom:18px;
        }
        .subText{
            font-size:18px;
            color:#cbd5e1;
            margin-bottom:45px;
        }
        .cursor{
            display:inline-block;
            width:3px;
            height:26px;
            background:#38bdf8;
            animation: blink 0.7s infinite;
        }
        @keyframes blink{
            0%,100%{opacity:1;}
            50%{opacity:0;}
        }
        .exploreBtn{
            padding:15px 32px;
            border:none;
            border-radius:35px;
            background:#38bdf8;
            color:#020617;
            font-weight:bold;
            font-size:16px;
            cursor:pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            margin-bottom:55px;
        }
        .exploreBtn:hover{
            transform: translateY(-5px);
            box-shadow:0 10px 28px rgba(56,189,248,0.52);
        }
        .cardWrapper{
            display:flex;
            gap:30px;
        }
        .homeCard{
            width:230px;
            padding:26px 18px;
            border:1px solid rgba(148,163,184,0.45);
            border-radius:18px;
            background:rgba(15,23,42,0.62);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor:pointer;
        }
        .homeCard:hover{
            transform: translateY(-6px);
            box-shadow:0 9px 24px rgba(96,165,250,0.36);
        }
        .homeCard h3{
            color:white;
            font-size:19px;
            margin-bottom:11px;
        }
        .homeCard p{
            color:#cbd5e1;
            font-size:14px;
            line-height:1.55;
        }
    </style>
</head>
<body>
    <div id="dotContainer"></div>
    <div class="container">
        <div class="profileBox">
            <img src="formalwhole.jpg" alt="Ma. Luisa Victoria S. Sanchez">
        </div>
        <div class="textArea">
            <div class="greeting"><span id="greetText"></span><span class="cursor"></span></div>
            <h1 class="fullName"><span id="nameText"></span></h1>
            <p class="subText"><span id="subText"></span></p>
            <button class="exploreBtn">Explore My Work →</button>
            <div class="cardWrapper">
                <a href="personal.html" style="text-decoration:none;">
                    <div class="homeCard">
                        <h3>Personal Information</h3>
                        <p>Get to know my background, education, and skills</p>
                    </div>
                </a>
                <a href="achievements.html" style="text-decoration:none;">
                    <div class="homeCard">
                        <h3>Achievements</h3>
                        <p>My awards, certifications, and milestones</p>
                    </div>
                </a>
                <a href="myfamilyandfriends.html" style="text-decoration:none;">
                    <div class="homeCard">
                        <h3>My Family and Friends</h3>
                        <p>Dedicated to the people who made it all possible</p>
                    </div>
                </a>
            </div>
        </div>
    </div>
    <script>
        const greetString = "HELLO, I'M";
        const nameString = "Ma. Luisa Victoria S. Sanchez";
        const subString = "An aspiring IT professional building digital solutions for tomorrow's world";
        let g=0,n=0,s=0;
        const speed = 60;

        function typeGreet(){
            if(g < greetString.length){
                document.getElementById("greetText").textContent += greetString[g];
                g++;
                setTimeout(typeGreet,speed);
            }else{
                setTimeout(typeName,300);
            }
        }
        function typeName(){
            if(n < nameString.length){
                document.getElementById("nameText").textContent += nameString[n];
                n++;
                setTimeout(typeName,speed);
            }else{
                setTimeout(typeSub,300);
            }
        }
        function typeSub(){
            if(s < subString.length){
                document.getElementById("subText").textContent += subString[s];
                s++;
                setTimeout(typeSub,speed);
            }
        }
        typeGreet();

        const dotContainer = document.getElementById("dotContainer");
        for(let i=0;i<75;i++){
            let dot = document.createElement("div");
            dot.classList.add("dot");
            const size = Math.random()*5 + 2;
            dot.style.width = size + "px";
            dot.style.height = size + "px";
            dot.style.left = Math.random()*100 + "%";
            dot.style.animationDelay = Math.random()*7 + "s";
            dotContainer.appendChild(dot);
        }
    </script>
</body>
</html>
