<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Portfolio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Georgia', 'Times New Roman', serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(180deg, #A05B3E, #C07659, #E8B69E, #F9E7DC);
      background-size: 400% 400%;
      animation: bgWarmFlow 10s ease infinite;
      color: #4A2F1F;
      overflow-x: hidden;
    }

    @keyframes bgWarmFlow {
      0% { background-position: 0% 0%; }
      50% { background-position: 0% 100%; }
      100% { background-position: 0% 0%; }
    }

    .home-container {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
    }

    .warm-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(160, 91, 62, 0.15), transparent 65%);
      border-radius: 50%;
      top: -100px;
      right: -50px;
      animation: softPulse 7s ease-in-out infinite;
    }

    .warm-glow.two {
      top: auto;
      right: auto;
      bottom: -100px;
      left: -50px;
      background: radial-gradient(circle, rgba(232, 182, 158, 0.2), transparent 65%);
      animation: softPulse 9s ease-in-out infinite reverse;
    }

    @keyframes softPulse {
      0% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.1); opacity: 0.9; }
      100% { transform: scale(1); opacity: 0.6; }
    }

    .profile-card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(160, 91, 62, 0.2);
      border-radius: 24px;
      padding: 45px 35px;
      box-shadow:
        0 8px 40px rgba(160, 91, 62, 0.15),
        0 0 60px rgba(232, 182, 158, 0.1) inset;
      backdrop-filter: blur(10px);
      max-width: 480px;
      width: 100%;
      text-align: center;
      animation: cardSlideUp 1.2s ease-out;
    }

    @keyframes cardSlideUp {
      from {
        opacity: 0;
        transform: translateY(60px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .profile-frame {
      position: relative;
      width: 220px;
      height: 220px;
      margin: 0 auto 25px;
    }

    .profile-frame::before {
      content: '';
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      background: linear-gradient(135deg, #A05B3E, #C07659, #E8B69E, #F9E7DC, #E8B69E, #C07659, #A05B3E);
      background-size: 300% 300%;
      animation: borderRotate 5s linear infinite;
      z-index: -1;
    }

    @keyframes borderRotate {
      0% { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    .profile-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 6px solid #F9E7DC;
    }

    .profile-card h1 {
      font-size: 2rem;
      margin-bottom: 8px;
      color: #70422F;
      letter-spacing: 1px;
      opacity: 0;
      animation: fadeIn 1s forwards ease-out;
      animation-delay: 0.3s;
    }

    .tagline {
      font-size: 1rem;
      color: #A05B3E;
      font-style: italic;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 20px;
      opacity: 0;
      animation: fadeIn 1s forwards ease-out;
      animation-delay: 0.5s;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .divider {
      width: 100px;
      height: 3px;
      background: linear-gradient(90deg, transparent, #C07659, #E8B69E, #C07659, transparent);
      margin: 0 auto 25px;
      border-radius: 2px;
      opacity: 0;
      animation: scaleIn 1s forwards ease-out;
      animation-delay: 0.7s;
    }

    @keyframes scaleIn {
      from { transform: scaleX(0); opacity: 0; }
      to { transform: scaleX(1); opacity: 1; }
    }

    .profile-card p {
      font-size: 1.05rem;
      color: #6B4433;
      margin-bottom: 30px;
      line-height: 1.8;
      opacity: 0;
      animation: fadeIn 1s forwards ease-out;
      animation-delay: 0.9s;
    }

    .btn-group {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      opacity: 0;
      animation: fadeInUp 1s forwards ease-out;
      animation-delay: 1.2s;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .btn {
      padding: 13px 28px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: all 0.4s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #A05B3E, #C07659);
      color: #fff;
      box-shadow: 0 4px 15px rgba(160, 91, 62, 0.25);
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(160, 91, 62, 0.35);
    }

    .btn-secondary {
      background: transparent;
      color: #A05B3E;
      border: 2px solid #C07659;
    }

    .btn-secondary:hover {
      background: #E8B69E;
      color: #5C3828;
      transform: translateY(-3px);
    }

    .signature {
      margin-top: 30px;
      font-size: 0.9rem;
      color: #A05B3E;
      font-style: italic;
      opacity: 0;
      animation: fadeIn 1s forwards ease-out;
      animation-delay: 1.5s;
    }
  </style>
</head>
<body>
  <div class="home-container">
    <div class="warm-glow"></div>
    <div class="warm-glow two"></div>

    <div class="profile-card">
      <div class="profile-frame">
        <img src="3d9d3e50-22d4-4faa-a470-c40b6427f6c0.jfif" alt="Profile Picture" class="profile-img" />
      </div>

      <h1>Ma. Luisa Victoria S. Sanchez</h1>
      <p class="tagline">Aspiring IT Professional</p>
      <div class="divider"></div>

      <p>Welcome to my portfolio ✨<br>
      A showcase of my journey, achievements, and dreams.</p>

      <div class="btn-group">
        <a href="personal.html" class="btn btn-primary">Personal Information</a>
        <a href="achievements.html" class="btn btn-secondary">Achievements</a>
      </div>

      <p class="signature">— Crafted with passion —</p>
    </div>
  </div>
</body>
</html>
