<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Family and Friends</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #020617 0%, #0f172a 50%, #020617 100%);
            color: #e0f2fe;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            text-align: center;
        }

        /* === GRID BACKGROUND === */
        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(56, 189, 248, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.06) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 0;
            animation: gridMove 25s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(60px); }
        }

        /* === FLOATING DOTS / PARTICLES === */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 8px #38bdf8;
            animation: particleFloat linear infinite;
        }

        @keyframes particleFloat {
            0% { transform: translateY(100vh); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh); opacity: 0; }
        }

        .content {
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 2.5rem;
            color: #38bdf8;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
            max-width: 1100px;
            margin-bottom: 30px;
        }

        .img-card {
            cursor: pointer;
            border: 1px solid rgba(56,189,248,0.25);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.4s ease;
            background: rgba(15,23,42,0.6);
        }

        .img-card:hover {
            border-color: #38bdf8;
            transform: translateY(-6px);
            box-shadow: 0 12px 30px rgba(56,189,248,0.18);
        }

        .img-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
        }

        .img-card p {
            padding: 10px;
            font-size: 0.9rem;
            color: #7dd3fc;
        }

        /* === POPUP MODAL === */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2,6,23,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10;
            padding: 20px;
        }

        .modal-content {
            background: rgba(15,23,42,0.9);
            border: 1px solid #38bdf8;
            border-radius: 14px;
            max-width: 500px;
            padding: 30px;
            color: #e0f2fe;
            line-height: 1.6;
        }

        .close-btn {
            margin-top: 20px;
            padding: 10px 24px;
            border: 1px solid #38bdf8;
            background: transparent;
            color: #38bdf8;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .close-btn:hover {
            background: #38bdf8;
            color: #020617;
        }

        /* === NAVIGATION BUTTONS === */
        .nav-buttons {
            display: flex;
            gap: 14px;
            justify-content: center;
        }

        .nav-buttons a {
            text-decoration: none;
            padding: 12px 24px;
            border: 1px solid #38bdf8;
            border-radius: 8px;
            color: #38bdf8;
            transition: all 0.3s ease;
        }

        .nav-buttons a:hover {
            background: #38bdf8;
            color: #020617;
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    <div class="particles" id="particles"></div>

    <div class="content">
        <h1>MY FAMILY AND FRIENDS</h1>
        <p class="subtitle">The people who make my journey meaningful and fun</p>

        <div class="image-grid">
            <!-- FAMILY -->
            <div class="img-card" data-message="My brother is one of my closest family members. We share laughs, support each other, and grow together through every challenge.">
                <img src="brother.jpg" alt="Brother">
                <p>Click for the message</p>
            </div>

            <div class="img-card" data-message="This warm hug reminds me how much my family loves me. Their care and affection give me strength to keep chasing my dreams.">
                <img src="hugging.jpg" alt="Hugging">
                <p>Click for the message</p>
            </div>

            <div class="img-card" data-message="A simple handshake with my family shows trust, respect, and the promise to always be there for one another.">
                <img src="shake hands.jpg" alt="Shake Hands">
                <p>Click for the message</p>
            </div>

            <!-- FRIENDS -->
            <div class="img-card" data-message="My friends are my second family. We laugh, study, and face difficulties side by side, making every moment memorable.">
                <img src="friends.jpg" alt="Friends">
                <p>Click for the message</p>
            </div>

            <div class="img-card" data-message="This photo from Baguio with my friends is a happy memory. We represented our school and created unforgettable experiences together.">
                <img src="baguio.jpg" alt="Baguio">
                <p>Click for the message</p>
            </div>
        </div>

        <div class="nav-buttons">
            <a href="achievements.html">PREVIOUS</a>
            <a href="index.html">BACK TO HOME</a>
        </div>
    </div>

    <!-- POPUP MODAL -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <p id="modal-text"></p>
            <button class="close-btn" id="closeModal">Close</button>
        </div>
    </div>

    <script>
        // Generate floating particles
        const particlesContainer = document.getElementById('particles');
        const particleCount = 40;
        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            const size = Math.random() * 3 + 1;
            const left = Math.random() * 100;
            const duration = Math.random() * 15 + 10;
            const delay = Math.random() * 20;
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.left = left + '%';
            particle.style.animationDuration = duration + 's';
            particle.style.animationDelay = delay + 's';
            particlesContainer.appendChild(particle);
        }

        // Popup message when click image
        const imgCards = document.querySelectorAll('.img-card');
        const modal = document.getElementById('modal');
        const modalText = document.getElementById('modal-text');
        const closeModal = document.getElementById('closeModal');

        imgCards.forEach(card => {
            card.addEventListener('click', () => {
                modalText.textContent = card.dataset.message;
                modal.style.display = 'flex';
            })
        })

        closeModal.addEventListener('click', () => {
            modal.style.display = 'none';
        })
    </script>
</body>
</html>
