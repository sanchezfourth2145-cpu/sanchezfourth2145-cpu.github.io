<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family and Friends</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }
        body {
            height: 100vh;
            background: #030f40;
            color: #e0f2fe;
            position: relative;
            overflow: hidden;
        }
        .dot-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .dot {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 6px #38bdf8;
            animation: dotRise linear infinite;
        }
        @keyframes dotRise {
            0% {
                transform: translateY(100vh);
                opacity: 0;
            }
            15% { opacity: 0.7; }
            85% { opacity: 0.7; }
            100% {
                transform: translateY(-10vh);
                opacity: 0;
            }
        }
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px 20px;
        }
        .section-title {
            font-size: 2.5rem;
            color: #38bdf8;
            margin-bottom: 12px;
            text-align: center;
        }
        .image-row {
            display: flex;
            gap: 22px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 18px;
            perspective: 1200px;
        }
        .flip-card {
            width: 300px;
            height: 210px;
            cursor: pointer;
            position: relative;
        }
        .flip-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.8s ease;
            transform-style: preserve-3d;
        }
        .flip-card.flipped .flip-inner {
            transform: rotateY(180deg);
        }
        .flip-front, .flip-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border: 1px solid rgba(56, 189, 248, 0.45);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .flip-front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* Dito ko itinaas ang mga importanteng parte */
        .flip-front img.brother {
            object-position: center 10%;
        }
        .flip-front img.hugging {
            object-position: center 5%;
        }
        .flip-front img.shakehands {
            object-position: center 10%;
        }
        .flip-front img.palaro {
            object-position: center 20%;
        }
        .flip-front img.friends {
            object-position: center 25%;
        }
        .flip-front img.baguio {
            object-position: center 30%;
        }
        .flip-back {
            background: rgba(56, 189, 248, 0.18);
            color: #e0f2fe;
            transform: rotateY(180deg);
            padding: 20px;
            text-align: center;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .nav-buttons {
            display: flex;
            gap: 14px;
            margin-top: 8px;
        }
        .nav-buttons button {
            padding: 9px 20px;
            background: transparent;
            border: 1px solid #38bdf8;
            color: #38bdf8;
            border-radius: 6px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .nav-buttons button:hover {
            background: rgba(56, 189, 248, 0.15);
        }
    </style>
</head>
<body>
    <div class="dot-bg" id="dotContainer"></div>
    <div class="container">
        <h1 class="section-title" id="familyTitle"></h1>
        <div class="image-row">

            <div class="flip-card" data-message="My brother is one of my closest family members. We share laughs, support each other, and create many happy memories together. He is always there to cheer me on in my journey.">
                <div class="flip-inner">
                    <div class="flip-front">
                        <img src="brother.jpg" class="brother" alt="Brother">
                    </div>
                    <div class="flip-back">
                        <p></p>
                    </div>
                </div>
            </div>

            <div class="flip-card" data-message="This moment shows the warm love of my family. Their hugs, care, and constant support give me strength to keep going and chase my dreams.">
                <div class="flip-inner">
                    <div class="flip-front">
                        <img src="hugging.jpg" class="hugging" alt="Hugging">
                    </div>
                    <div class="flip-back">
                        <p></p>
                    </div>
                </div>
            </div>

            <div class="flip-card" data-message="A simple handshake that represents trust, respect, and the strong bond I share with my family. We face challenges hand in hand.">
                <div class="flip-inner">
                    <div class="flip-front">
                        <img src="shakehands.jpg" class="shakehands" alt="Shakehands">
                    </div>
                    <div class="flip-back">
                        <p></p>
                    </div>
                </div>
            </div>

        </div>

        <h1 class="section-title" id="friendsTitle"></h1>
        <div class="image-row">

            <div class="flip-card" data-message="This photo from our Palarong Pambansa in Baguio represents pride, teamwork, and the fun moments we shared as friends while competing and supporting each other.">
                <div class="flip-inner">
                    <div class="flip-front">
                        <img src="palaro.jpg" class="palaro" alt="Palaro">
                    </div>
                    <div class="flip-back">
                        <p></p>
                    </div>
                </div>
            </div>

            <div class="flip-card" data-message="True friends make every moment memorable. We laugh, help each other, and create stories that I will treasure for a very long time.">
                <div class="flip-inner">
                    <div class="flip-inner">
                        <div class="flip-front">
                            <img src="friends.jpg" class="friends" alt="Friends">
                        </div>
                        <div class="flip-back">
                            <p></p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="flip-card" data-message="Baguio will always be a special place for me and my friends. The cold weather, fun adventures, and happy moments we had there are unforgettable.">
                <div class="flip-inner">
                    <div class="flip-front">
                        <img src="baguio.jpg" class="baguio" alt="Baguio">
                    </div>
                    <div class="flip-back">
                        <p></p>
                    </div>
                </div>
            </div>

        </div>

        <div class="nav-buttons">
            <button id="prevBtn">PREVIOUS</button>
            <button id="homeBtn">BACK TO HOME</button>
        </div>
    </div>

    <script>
        const dotContainer = document.getElementById('dotContainer');
        for(let i=0; i<35; i++){
            const dot = document.createElement('div');
            dot.classList.add('dot');
            const left = Math.random() * 100;
            const duration = Math.random() * 12 + 8;
            const delay = Math.random() * 10;
            dot.style.left = left + '%';
            dot.style.animationDuration = duration + 's';
            dot.style.animationDelay = delay + 's';
            dotContainer.appendChild(dot);
        }

        function typeText(text, element, speed = 100){
            element.textContent = "";
            let index = 0;
            const interval = setInterval(()=>{
                if(index < text.length){
                    element.textContent += text[index];
                    index++;
                } else {
                    clearInterval(interval);
                }
            }, speed);
        }

        typeText("MY FAMILY", document.getElementById("familyTitle"));
        setTimeout(()=>{
            typeText("MY FRIENDS", document.getElementById("friendsTitle"));
        }, 1400);

        const allCards = document.querySelectorAll('.flip-card');
        allCards.forEach(card=>{
            const backP = card.querySelector('.flip-back p');
            backP.textContent = card.dataset.message;

            card.addEventListener('click', ()=>{
                allCards.forEach(c=>{
                    if(c !== card) c.classList.remove('flipped');
                });
                card.classList.toggle('flipped');
            });
        })

        document.getElementById('prevBtn').addEventListener('click', ()=>{
            window.location.href = "achievements.html";
        });

        document.getElementById('homeBtn').addEventListener('click', ()=>{
            window.location.href = "index.html";
        });
    </script>
</body>
</html>
