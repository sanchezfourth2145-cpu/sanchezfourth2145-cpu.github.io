<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family and Friends</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }
        body {
            height: 100vh;
            background: #030f40;
            color: #e0f2fe;
            position: relative;
            overflow: hidden;
        }
        /* Dots animation mula baba pataas */
        .dot-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .dot {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 6px #38bdf8;
            animation: dotRise linear infinite;
        }
        @keyframes dotRise {
            0% {
                transform: translateY(100vh);
                opacity: 0;
            }
            15% { opacity: 0.7; }
            85% { opacity: 0.7; }
            100% {
                transform: translateY(-10vh);
                opacity: 0;
            }
        }
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .section-title {
            font-size: 2.4rem;
            color: #38bdf8;
            margin-bottom: 14px;
            text-align: center;
        }
        .image-row {
            display: flex;
            gap: 18px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 18px;
            perspective: 1000px;
        }
        /* Mas malaki na picture */
        .flip-card {
            width: 240px;
            height: 170px;
            cursor: pointer;
            position: relative;
        }
        .flip-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.7s ease;
            transform-style: preserve-3d;
        }
        .flip-card.flipped .flip-inner {
            transform: rotateY(180deg);
        }
        .flip-front, .flip-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 12px;
            overflow: hidden;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .flip-front img {
            width:100%;
            height:100%;
            object-fit:cover;
        }
        .flip-back {
            background:rgba(56,189,248,0.12);
            color:#e0f2fe;
            transform: rotateY(180deg);
        }
        .nav-buttons {
            display: flex;
            gap: 14px;
            margin-top: 8px;
        }
        .nav-buttons button {
            padding: 9px 20px;
            background: transparent;
            border: 1px solid #38bdf8;
            color: #38bdf8;
            border-radius: 6px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .nav-buttons button:hover {
            background: rgba(56, 189, 248, 0.15);
        }
        /* Smooth pop‑up */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.75);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: opacity 0.4s ease;
        }
        .popup-overlay.active {
            display: flex;
        }
        .popup-box {
            max-width: 480px;
            padding: 24px;
            background: rgba(3, 15, 64, 0.92);
            border: 1px solid #38bdf8;
            border-radius: 14px;
            text-align: center;
            transform: scale(0.85);
            transition: transform 0.4s ease;
        }
        .popup-overlay.active .popup-box {
            transform: scale(1);
        }
        .popup-message {
            font-size: 1rem;
            color: #e0f2fe;
            min-height: 90px;
            margin-bottom: 18px;
        }
        .close-btn {
            padding: 8px 18px;
            border: 1px solid #38bdf8;
            color: #38bdf8;
            background: transparent;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="dot-bg" id="dotContainer"></div>
    <div class="container">
        <!-- FAMILY SECTION -->
        <h1 class="section-title" id="familyTitle"></h1>
        <div class="image-row">
            <div class="flip-card" data-message="My brother is one of my closest family members. We share laughs, support each other, and create many happy memories together. He is always there to cheer me on in my journey.">
                <div class="flip-inner">
                    <div class="flip-front">
                        <img src="brother.jpg" alt="Brother">
                    </div>
                    <div class="flip-back"></div>
                </div>
            </div>
            <div class="flip-card" data-message="This moment shows the warm love of my family. Their hugs, care, and constant support give me strength to keep going and chase my dreams.">
                <div class="flip-inner">
                    <div class="flip-front">
                        <img src="hugging.jpg" alt="Hugging">
                    </div>
                    <div class="flip-back"></div>
                </div>
            </div>
            <div class="flip-card" data-message="A simple handshake that represents trust, respect, and the strong bond I share with my family. We face challenges hand in hand.">
                <div class="flip-inner">
                    <div class="flip-front">
                        <img src="shakehands.jpg" alt="Shakehands">
                    </div>
                    <div class="flip-back"></div>
                </div>
            </div>
        </div>

        <!-- FRIENDS SECTION -->
        <h1 class="section-title" id="friendsTitle"></h1>
        <div class="image-row">
            <div class="flip-card" data-message="This photo from our Palarong Pambansa in Baguio represents pride, teamwork, and the fun moments we shared as friends while competing and supporting each other.">
                <div class="flip-inner">
                    <div class="flip-front">
                        <img src="palaro.jpg" alt="Palaro">
                    </div>
                    <div class="flip-back"></div>
                </div>
            </div>
            <div class="flip-card" data-message="True friends make every moment memorable. We laugh, help each other, and create stories that I will treasure for a very long time.">
                <div class="flip-inner">
                    <div class="flip-front">
                        <img src="friends.jpg" alt="Friends">
                    </div>
                    <div class="flip-back"></div>
                </div>
            </div>
            <div class="flip-card" data-message="Baguio will always be a special place for me and my friends. The cold weather, fun adventures, and happy moments we had there are unforgettable.">
                <div class="flip-inner">
                    <div class="flip-front">
                        <img src="baguio.jpg" alt="Baguio">
                    </div>
                    <div class="flip-back"></div>
                </div>
            </div>
        </div>

        <div class="nav-buttons">
            <button id="prevBtn">PREVIOUS</button>
            <button id="homeBtn">BACK TO HOME</button>
        </div>
    </div>

    <!-- Popup -->
    <div class="popup-overlay" id="popupOverlay">
        <div class="popup-box">
            <p class="popup-message" id="popupText"></p>
            <button class="close-btn" id="closePopup">Close</button>
        </div>
    </div>

    <script>
        // Dots
        const dotContainer = document.getElementById('dotContainer');
        for(let i=0; i<35; i++){
            const dot = document.createElement('div');
            dot.classList.add('dot');
            const left = Math.random() * 100;
            const duration = Math.random() * 12 + 8;
            const delay = Math.random() * 10;
            dot.style.left = left + '%';
            dot.style.animationDuration = duration + 's';
            dot.style.animationDelay = delay + 's';
            dotContainer.appendChild(dot);
        }

        // Typing effect: MY FAMILY at MY FRIENDS
        function typeText(text, element, speed = 100){
            element.textContent = "";
            let index = 0;
            const interval = setInterval(()=>{
                if(index < text.length){
                    element.textContent += text[index];
                    index++;
                } else {
                    clearInterval(interval);
                }
            }, speed);
        }
        typeText("MY FAMILY", document.getElementById("familyTitle"));
        setTimeout(()=>{
            typeText("MY FRIENDS", document.getElementById("friendsTitle"));
        }, 1400);

        // Flip muna, tapos lalabas ang message
        const popupOverlay = document.getElementById('popupOverlay');
        const popupText = document.getElementById('popupText');
        const closePopup = document.getElementById('closePopup');
        document.querySelectorAll('.flip-card').forEach(card=>{
            card.addEventListener('click', ()=>{
                card.classList.add('flipped');
                setTimeout(()=>{
                    popupText.textContent = card.dataset.message;
                    popupOverlay.classList.add('active');
                    card.classList.remove('flipped');
                },700);
            })
        })
        closePopup.addEventListener('click', ()=>{
            popupOverlay.classList.remove('active');
        })

        // Navigation
        document.getElementById('prevBtn').addEventListener('click', ()=>{
            window.location.href = "achievements.html";
        })
        document.getElementById('homeBtn').addEventListener('click', ()=>{
            window.location.href = "index.html";
        })
    </script>
</body>
</html>
